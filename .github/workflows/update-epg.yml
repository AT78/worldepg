name: Update EPG
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: worldepg-update
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build worldwide and country feeds from curated upstream lists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build.py
      - name: Validate generated feeds
        run: python scripts/validate.py
      - name: Check release asset size limits
        shell: bash
        run: |
          oversized="$(find guide.epg guide.xml guide.xml.gz countries -type f -size +1900M -print -quit)"
          if [ -n "$oversized" ]; then
            echo "::error::Release asset is approaching GitHub's 2 GB per-file limit: $oversized"
            exit 1
          fi
      - name: Publish feeds as GitHub Release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          notes="Automatically refreshed worldwide and country XMLTV feeds. See the repository README for feed details and coverage limitations."
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "Latest EPG feeds" --notes "$notes" --latest
          else
            gh release create latest --target "$GITHUB_SHA" --title "Latest EPG feeds" --notes "$notes" --latest
          fi
          shopt -s nullglob
          assets=(guide.epg guide.xml guide.xml.gz status.json countries/*.xml)
          # Upload/replace the new set before pruning stale country assets so
          # a failed upload does not wipe the currently published feed set.
          gh release upload latest "${assets[@]}" --clobber
          declare -A keep
          for file in "${assets[@]}"; do keep["$(basename "$file")"]=1; done
          while IFS= read -r existing; do
            if [ -n "$existing" ] && [ -z "${keep[$existing]:-}" ]; then
              gh release delete-asset latest "$existing" --yes
            fi
          done < <(gh release view latest --json assets --jq '.assets[].name')
      - name: Commit build status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add status.json
          if git diff --cached --quiet; then echo 'No status changes'; else git commit -m 'Update EPG build status'; git push; fi
