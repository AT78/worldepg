name: Update EPG
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies\n        run: python -m pip install --upgrade pip\n      - name: Build worldwide and country feeds
        run: python scripts/build.py
      - name: Commit generated feeds
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add guide.epg guide.xml guide.xml.gz countries status.json
          if git diff --cached --quiet; then echo 'No feed changes'; else git commit -m 'Update EPG feeds'; git push; fi
