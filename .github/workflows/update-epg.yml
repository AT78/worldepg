name: Update EPG
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: worldepg-update
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build worldwide and country feeds from curated upstream lists
        run: python scripts/build.py
      - name: Validate generated feeds
        run: python scripts/validate.py
      - name: Commit generated feeds
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add guide.epg guide.xml guide.xml.gz countries status.json
          if git diff --cached --quiet; then echo 'No feed changes'; else git commit -m 'Update EPG feeds'; git push; fi
